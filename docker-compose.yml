version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mangea
      TZ: Asia/Jakarta
    command: --default-time-zone=+07:00
    ports:
      - "3306:3306"
    volumes:
      - mangea_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mangea_mysql_data:
